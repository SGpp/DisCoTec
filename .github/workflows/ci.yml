name: DisCoTec-github-CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# ── global options (analogous to Jenkins logRotation & timeout)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

defaults:
  run:
    shell: bash

jobs:
  test-matrix:
    name: build-and-test (${{ matrix.compiler }}, ${{ matrix.mpi }}, ${{ matrix.build_type }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc]           # todo test clang/flang
        mpi:      [openmpi, mpich]
        build_type:  [Release, Debug]
      fail-fast: false
    env:
      CC: /usr/bin/gcc
      CXX: /usr/bin/g++
      FC: /usr/bin/gfortran
      SPACK_USER_CACHE_PATH: spack/user_cache
      SPACK_USER_CONFIG_PATH: spack/user_config
      SPACK_SYSTEM_CONFIG_PATH: spack/system_config
    steps:
      - name: update system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake
          if [ "${{ matrix.compiler }}" == "gcc" ]; then
            sudo apt-get install -y gcc g++ gfortran
          elif [ "${{ matrix.compiler }}" == "clang" ]; then
            sudo apt-get install -y clang-20 flang-20
          fi
          if [ "${{ matrix.mpi }}" == "openmpi" ]; then
            sudo apt-get install -y openmpi-bin openmpi-common libopenmpi-dev
          elif [ "${{ matrix.mpi }}" == "mpich" ]; then
            sudo apt-get install -y mpich libmpich-dev
          fi
          MPI_LAUNCHER=/usr/bin/mpiexec.${{ matrix.mpi }}
          if [ "${{ matrix.mpi }}" == "mpich" ] && mpichversion | grep -- '--with-pmix' > /dev/null; then
            # Ubuntu's PMIx-enabled MPICH cannot use Hydra's PMI launcher.
            # https://github.com/pmodels/mpich/issues/7064#issuecomment-2301026290
            sudo apt-get install -y openmpi-bin
            MPI_LAUNCHER=/usr/bin/mpiexec.openmpi
          fi
          # Spack's external MPI recipes use /usr/bin/mpicc and mpicxx.
          # Installing openmpi-bin can switch these alternatives to OpenMPI.
          # Keep dependency builds on the matrix MPI, independently of its launcher.
          sudo update-alternatives --set mpi /usr/bin/mpicc.${{ matrix.mpi }}
          echo "MPI_LAUNCHER=$MPI_LAUNCHER" >> "$GITHUB_ENV"
      - name: Checkout spack
        uses: spack/setup-spack@5ab3c91bdefffffad9a7e45d1d156146afebb3a7
        with:
          ref: v1.2.2
          buildcache: true
          color: true
          path: spack
      - name: Spack bootstrap & install
        run: |
          . ./spack/share/spack/setup-env.sh
          spack bootstrap now
          spack compiler find
          spack config add "packages:gcc:buildable:false"
          spack external find --exclude curl --exclude perl
          # spack mirror add --unsigned github-actions-buildcache oci://ghcr.io/spack/github-actions-buildcache
          spack config add "packages:cmake:buildable:false"
          # MPI packages are outside the default external discovery tags.
          spack external find --not-buildable ${{ matrix.mpi }}
          spack install ${{ matrix.compiler }}
          spack install --only dependencies -y discotec@main -lto +compression %${{ matrix.compiler }} ^${{ matrix.mpi }}

      - name: Checkout DisCoTec
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          path: discotec

      - name: Load dependencies + CMake Configure
        working-directory: discotec
        run: |
          . ../spack/share/spack/setup-env.sh
          spack load --first ${{ matrix.mpi }}
          spack load --first cmake
          spack load --first boost
          spack load --first glpk highfive lz4
          # Select matching MPI wrappers and launcher instead of system alternatives.
          cmake -B build -S . \
            -DMPI_C_COMPILER=mpicc.${{ matrix.mpi }} \
            -DMPI_CXX_COMPILER=mpicxx.${{ matrix.mpi }} \
            -DMPIEXEC_EXECUTABLE="$MPI_LAUNCHER" \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DDISCOTEC_TEST=ON -DDISCOTEC_TIMING=ON \
            -DDISCOTEC_ENABLEFT=OFF -DDISCOTEC_GENE=OFF \
            -DDISCOTEC_USE_HIGHFIVE=ON -DDISCOTEC_OPENMP=ON \
            -DDISCOTEC_USE_LTO=OFF -DDISCOTEC_WITH_COMPRESSION=ON

      - name: Build
        working-directory: discotec
        run:  cmake --build build -j

      - name: Unit tests
        env:
          # Hosted runners cannot reliably use UCX's RDMA/verbs transports.
          # These CPU tests use shared memory, TCP, and process-local loopback.
          UCX_TLS: "sm,tcp,self"
        working-directory: discotec/tests
        timeout-minutes: 360
        run:  |
          . ../../spack/share/spack/setup-env.sh
          spack load --first ${{ matrix.mpi }}
          if [ "$MPI_LAUNCHER" == "/usr/bin/mpiexec.openmpi" ]; then
            export MPI_RUN_COMMAND="$MPI_LAUNCHER --map-by node:OVERSUBSCRIBE -n "
          else
            export MPI_RUN_COMMAND="$MPI_LAUNCHER -np "
          fi

          export OMP_NUM_THREADS=2
          OMPI_ALLOW_RUN_AS_ROOT=1 \
            ${MPI_RUN_COMMAND} 9 ./test_distributedcombigrid_boost --run_test=mpisystem --log_level=message
          ${MPI_RUN_COMMAND} 9 ./test_distributedcombigrid_boost --run_test=fullgrid
          ${MPI_RUN_COMMAND} 9 ./test_distributedcombigrid_boost --run_test=io
          ${MPI_RUN_COMMAND} 9 ./test_distributedcombigrid_boost --run_test=loadmodel
          ${MPI_RUN_COMMAND} 9 ./test_distributedcombigrid_boost --run_test=reduce
          ${MPI_RUN_COMMAND} 9 ./test_distributedcombigrid_boost --run_test=rescheduling
          ${MPI_RUN_COMMAND} 9 ./test_distributedcombigrid_boost --run_test=task
          ${MPI_RUN_COMMAND} 9 ./test_distributedcombigrid_boost --run_test=stats
          ${MPI_RUN_COMMAND} 9 ./test_distributedcombigrid_boost --run_test=worker
          ${MPI_RUN_COMMAND} 9 ./test_distributedcombigrid_boost --run_test=hierarchization --log_level=message
          ${MPI_RUN_COMMAND} 9 ./test_distributedcombigrid_boost --run_test=parameterio
          ${MPI_RUN_COMMAND} 9 ./test_distributedcombigrid_boost --run_test=integration
          #${MPI_RUN_COMMAND} 9 ./test_distributedcombigrid_boost --run_test=ftolerance # cf https://github.com/SGpp/DisCoTec/issues
          ${MPI_RUN_COMMAND} 9 ./test_distributedcombigrid_boost --run_test=thirdLevel/test_workers_only,test_workers_2d,test_8_workers  # file-based exchange needs to execute correctly
          ${MPI_RUN_COMMAND} 9 ./test_distributedcombigrid_boost --run_test=distributedsparsegrid/test_create* --log_level=message
          ${MPI_RUN_COMMAND} 9 ./test_distributedcombigrid_boost --run_test=distributedsparsegrid/test_write* --log_level=message
          ${MPI_RUN_COMMAND} 9 ./test_distributedcombigrid_boost --run_test=distributedsparsegrid/test_sparse* --log_level=message
          ${MPI_RUN_COMMAND} 9 ./test_distributedcombigrid_boost --run_test=distributedsparsegrid

  test-paliwa:
    name: build-and-test-paliwa (${{ matrix.mpi }}, ${{ matrix.build_type }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mpi:      [openmpi]
        build_type:  [Release]
      fail-fast: false
    env:
      SPACK_USER_CACHE_PATH: spack/user_cache
      SPACK_USER_CONFIG_PATH: spack/user_config
      SPACK_SYSTEM_CONFIG_PATH: spack/system_config
    steps:
      - name: Update system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake gcc
          if [ "${{ matrix.mpi }}" == "openmpi" ]; then
            sudo apt-get install -y openmpi-bin openmpi-common libopenmpi-dev
          elif [ "${{ matrix.mpi }}" == "mpich" ]; then
            sudo apt-get install -y mpich libmpich-dev
          fi
          MPI_LAUNCHER=/usr/bin/mpiexec.${{ matrix.mpi }}
          if [ "${{ matrix.mpi }}" == "mpich" ] && mpichversion | grep -- '--with-pmix' > /dev/null; then
            # Ubuntu's PMIx-enabled MPICH cannot use Hydra's PMI launcher.
            # https://github.com/pmodels/mpich/issues/7064#issuecomment-2301026290
            sudo apt-get install -y openmpi-bin
            MPI_LAUNCHER=/usr/bin/mpiexec.openmpi
          fi
          # Spack's external MPI recipes use /usr/bin/mpicc and mpicxx.
          # Installing openmpi-bin can switch these alternatives to OpenMPI.
          # Keep dependency builds on the matrix MPI, independently of its launcher.
          sudo update-alternatives --set mpi /usr/bin/mpicc.${{ matrix.mpi }}
          echo "MPI_LAUNCHER=$MPI_LAUNCHER" >> "$GITHUB_ENV"

      - name: Checkout spack
        uses: spack/setup-spack@5ab3c91bdefffffad9a7e45d1d156146afebb3a7
        with:
          ref: v1.2.2
          buildcache: true
          color: true
          path: spack

      - name: Checkout DisCoTec
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          path: discotec

      - name: Checkout paliwa
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          repository: freifrauvonbleifrei/paliwa
          path: paliwa

      - name: Spack bootstrap & install dependencies
        run: |
          . ./spack/share/spack/setup-env.sh
          spack bootstrap now
          spack compiler find
          spack external find --exclude curl --exclude perl
          spack config add "packages:cmake:buildable:false"
          # MPI packages are outside the default external discovery tags.
          spack external find --not-buildable ${{ matrix.mpi }}
          spack repo add discotec/spack_repo/discotec
          spack repo add paliwa/spack_repo/paliwa
          spack install gcc
          spack install ddc@0.11.0 ~splines ~fft ~tests ~pdi %gcc
          spack install --only dependencies -y discotec@main -lto +compression +paliwa %gcc ^${{ matrix.mpi }}

      - name: Build & install paliwa
        run: |
          . ./spack/share/spack/setup-env.sh
          spack load gcc ${{ matrix.mpi }} cmake kokkos ddc
          cmake -S paliwa -B paliwa/build \
            -DMPI_C_COMPILER=mpicc.${{ matrix.mpi }} \
            -DMPI_CXX_COMPILER=mpicxx.${{ matrix.mpi }} \
            -DMPIEXEC_EXECUTABLE="$MPI_LAUNCHER" \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/paliwa_install \
            -DPALIWA_BUILD_TESTS=OFF -DPALIWA_WITH_MPI=ON
          cmake --install paliwa/build

      - name: CMake Configure DisCoTec with paliwa
        working-directory: discotec
        run: |
          . ../spack/share/spack/setup-env.sh
          spack load gcc ${{ matrix.mpi }} cmake boost glpk highfive lz4 kokkos ddc
          # Select matching MPI wrappers and launcher instead of system alternatives.
          cmake -B build -S . \
            -DMPI_C_COMPILER=mpicc.${{ matrix.mpi }} \
            -DMPI_CXX_COMPILER=mpicxx.${{ matrix.mpi }} \
            -DMPIEXEC_EXECUTABLE="$MPI_LAUNCHER" \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/paliwa_install" \
            -DDISCOTEC_TEST=ON -DDISCOTEC_TIMING=ON \
            -DDISCOTEC_ENABLEFT=OFF -DDISCOTEC_GENE=OFF \
            -DDISCOTEC_USE_HIGHFIVE=ON -DDISCOTEC_OPENMP=ON \
            -DDISCOTEC_USE_LTO=OFF -DDISCOTEC_WITH_COMPRESSION=ON \
            -DDISCOTEC_USE_PALIWA=ON

      - name: Build
        working-directory: discotec
        run: cmake --build build -j$(nproc)

      - name: Unit tests
        env:
          UCX_TLS: "sm,tcp,self"
        working-directory: discotec/tests
        timeout-minutes: 60
        run: |
          . ../../spack/share/spack/setup-env.sh
          spack load --first ${{ matrix.mpi }}
          if [ "$MPI_LAUNCHER" == "/usr/bin/mpiexec.openmpi" ]; then
            export MPI_RUN_COMMAND="$MPI_LAUNCHER --map-by node:OVERSUBSCRIBE -n "
          else
            export MPI_RUN_COMMAND="$MPI_LAUNCHER -np "
          fi

          export OMP_NUM_THREADS=2
          ${MPI_RUN_COMMAND} 9 ./test_distributedcombigrid_boost --run_test=hierarchization --log_level=message
